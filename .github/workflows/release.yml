name: Release Desktop

# 桌面端发布流水线：macOS（arm64）与 Windows（x64）。
#
# 触发与产物（规则、验收场景与缺口清单见 docs/specs/desktop-release.md）
# - 推送 `v*.*.*` tag：稳定发布。打包前用 tag 版本改写根 package.json，使程序内版本
#   （app.getVersion()、About、遥测）、产物文件名与 Release tag 三者一致。
# - 推送到 canary 分支：集成构建，版本 `<根 package.json 版本>-dev.<sha8>`，只更新固定 tag 的指针发布
#   （`Dev channel (latest canary)`）——不建 dev-<sha> 发布，避免 Releases 堆成一串历史构建。
# - workflow_dispatch：手动按 dev 通道跑一次；stable 通道必须在 vX.Y.Z tag 上触发。
#
# 仓库既有约定（改这条流水线前先读对应实现）
# - `ZCODE_ENV=production`：builtin provider 配置与产品身份都按 production 解析；缺失时
#   desktop-product-identity.mjs 会回落到 Preview 身份，产物变成 “ZCode Preview” 并带 `_TEST` 后缀。
# - Windows job 带 `ZCODE_SKIP_REMOTE_ASSETS=1`：Windows 桌面安装包不依赖 mock-cdn remote 资产
#   （packages/desktop/scripts/prepare-runtime-assets.mjs:56），跳过可显著缩短作业时间。
# - macOS 签名默认关闭（packages/desktop/electron-builder.config.js 要求 ZCODE_ENABLE_MAC_SIGN=1
#   且存在证书身份）；配置 MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD / MAC_SIGNING_IDENTITY 三个 secret
#   后本流水线自动开启签名。注意两点边界（见 electron-builder.config.js:667-691 的说明）：
#   1) 仓库刻意关闭 electron-builder 内置公证（notarize: false），公证是独立阶段，本流水线不做；
#   2) 嵌套运行时（Contents/Resources/glm、tools 及 CUA Helper）在原流水线里由独立 job 预签名并 staple，
#      这里被 signIgnore 跳过，因此仅打开签名开关只覆盖主 app，不构成可公证的完整签名链。
# - macOS 只出 arm64 包（发布范围决定）。如需 Intel 包，必须加 Intel runner 上的构建条目：
#   node-pty 在非 Windows 宿主按宿主架构 electron-rebuild，且运行时优先加载
#   build/Release/pty.node，在 arm64 宿主上打 x64 包会把 arm64 原生模块混进产物。
#
# FORK(github-update) 更新通道（见 docs/features/github-update/design.md）
# 客户端不再查上游 zcode.z.ai 的服务端 manifest，改为查本仓库的 GitHub Release：
# - stable 通道：`releases/latest/download`（GitHub 定义的「最新非 prerelease」），读 latest.yml / latest-mac.yml；
# - preview 通道：固定 tag `canary-build` 的指针 Release（只覆盖资产、不移动 tag），读 dev.yml / dev-mac.yml。
# 因此本流水线必须上传更新元数据与差分块；只发安装包会让客户端报「找不到 channel 文件」。
# 元数据文件名由 packages/desktop/electron-builder.config.js 的 detectUpdateChannel 决定。

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - canary
  workflow_dispatch:
    inputs:
      channel:
        description: "发布通道：dev 为集成构建（预发布）；stable 只能在 vX.Y.Z tag 上触发"
        type: choice
        options:
          - dev
          - stable
        default: dev

# 同一 ref 的发布串行执行且不取消进行中的构建，避免 Release 收到半套产物。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZCODE_ENV: production
  # GitHub 托管 runner 直连 GitHub 的 release CDN；仓库默认镜像面向国内网络（bundle.mjs:124-155）。
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  # 把 Electron / electron-builder 缓存固定在工作区内，让 actions/cache 的路径在各 runner 上一致。
  ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # 版本解析只用 Node 内置能力（scripts/ci/release-version.mjs），因此这里不需要安装依赖。
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/ci/release-version.mjs apply --tag "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ inputs.channel }}" == "stable" ]]; then
              echo "::error::稳定发布必须由 vX.Y.Z tag 触发，当前 ref=${GITHUB_REF_NAME}"
              exit 1
            fi
            node scripts/ci/release-version.mjs apply --dev-commit "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_tag=dev-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify workspace gates
    needs: [resolve]
    # dev 渠道（canary 推送）跳过全部校验，直接进集成以缩短 CI 时间；tag 发布仍走完整门禁。
    # 依赖它的 build 作业用 result 判定容忍 skipped，见下。
    if: ${{ needs.resolve.outputs.channel != 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 这里只跑静态检查，不需要原生模块和 Electron 运行时，跳过安装脚本可省掉一次 Electron 下载。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      # 二开移除不变量：同步上游后若被移除的强更 gate / 服务端更新源又回来了，在发布前拦住。
      # 规则表与说明见 scripts/check-fork-removals.mjs。
      - name: Fork removal invariants
        run: pnpm fork:check-removals

      # apps/zcode-cli/packages/core/test 的单测会 import 上游 CLI 包（tool 入口等），
      # 而这些包的 exports 指向 dist：verify 只 install 不 build，缺 dist 会 ERR_MODULE_NOT_FOUND
      # 让整组失败。这里按依赖链构建 core（约 4 个包），其余组只 import 源码，不需要构建。
      - name: Build CLI packages used by unit tests
        run: pnpm --dir apps/zcode-cli -r --filter "@zcode/core..." run build

      # 依赖契约与功能单测：上游 API 形状/默认值/语义变更的第一信号，见 AGENTS.md「依赖契约测试」。
      - name: Unit tests
        run: pnpm test:unit

      # 仓库当前 third-party/inventory.json 记录的 package.json 哈希与文件不一致（其余 2867 项输入一致），
      # 需要有人执行 `node scripts/licenses.mjs notices` 重新生成清单。因此这里只作提示，不阻塞发布。
      # 打包链路本身不校验清单新鲜度（scripts/third-party-notices.mjs:9-12），不影响产物。
      - name: Third-party inventory check (advisory)
        continue-on-error: true
        run: node scripts/licenses.mjs check --strict

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [resolve, verify]
    # verify 在 dev 渠道被跳过（不是失败）：这里按 result 判定，成功或跳过都继续。
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    strategy:
      fail-fast: false
      # 只发布 Apple Silicon 包。若将来要出 Intel 包，必须在 Intel runner 上构建：
      # node-pty 在非 Windows 宿主按宿主架构 electron-rebuild，且运行时优先加载
      # build/Release/pty.node（node_modules/node-pty/lib/utils.js:19），
      # 在 arm64 宿主上打 x64 包会把 arm64 原生模块混进产物。
      # 届时在此加回 { arch: x64, runner: macos-15-intel }。
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ZCODE_DESKTOP_DIST_DIR: dist-mac-${{ matrix.arch }}
      MAC_SIGN_READY: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.MAC_SIGNING_IDENTITY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # actions/cache 要求路径在恢复阶段就存在，先建目录再走缓存。
      # 用相对路径（步骤 cwd 即 github.workspace）避免 Windows 上反斜杠绝对路径进 bash。
      - name: Prepare cache directories
        shell: bash
        run: mkdir -p .electron-cache .electron-builder-cache packages/desktop/mock-cdn

      - name: Cache Electron and electron-builder artifacts
        uses: actions/cache@v6
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      # mock-cdn 存放跨平台远程运行时资产，按版本分目录；restore-keys 让新版本复用旧目录里已有的组件。
      - name: Cache remote runtime assets
        uses: actions/cache@v6
        with:
          path: packages/desktop/mock-cdn
          key: mock-cdn-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/prepare-prebuilds.mjs') }}
          restore-keys: |
            mock-cdn-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: node scripts/ci/release-version.mjs apply --version "${{ needs.resolve.outputs.version }}"

      - name: Enable macOS code signing
        if: env.MAC_SIGN_READY == 'true'
        shell: bash
        env:
          CSC_LINK_INPUT: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD_INPUT: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY_INPUT: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          {
            echo "CSC_LINK=${CSC_LINK_INPUT}"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD_INPUT}"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY_INPUT}"
            echo "ZCODE_ENABLE_MAC_SIGN=1"
          } >> "$GITHUB_ENV"

      - name: Bundle desktop app
        run: pnpm bundle:desktop -- --os mac --arch ${{ matrix.arch }}

      # 验收 tag 版本确实进了程序：比对 app.asar 内 package.json 与 build-meta.json。
      - name: Verify packaged version
        shell: bash
        env:
          BUNDLE_DIR: packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}
        run: |
          set -euo pipefail
          app_dir=$([[ "${{ matrix.arch }}" == "arm64" ]] && echo mac-arm64 || echo mac)
          node scripts/ci/release-version.mjs verify \
            --expect "${{ needs.resolve.outputs.version }}" \
            --expect-commit "${{ needs.resolve.outputs.commit }}" \
            --asar "${BUNDLE_DIR}/${app_dir}/ZCode.app/Contents/Resources/app.asar"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: ${{ needs.resolve.outputs.prerelease == 'true' && 14 || 90 }}
          path: |
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/ZCode-${{ needs.resolve.outputs.version }}-mac-${{ matrix.arch }}.dmg
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/ZCode-${{ needs.resolve.outputs.version }}-mac-${{ matrix.arch }}.zip
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/ZCode-${{ needs.resolve.outputs.version }}-mac-${{ matrix.arch }}.zip.blockmap
            # FORK(github-update): 更新元数据随包发布。stable 与 dev 只会命中其中一个，
            # 因此逐个列出（if-no-files-found 只在「全都没命中」时报错）。
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/latest-mac.yml
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/dev-mac.yml

  build-windows:
    name: Build Windows (x64)
    needs: [resolve, verify]
    # verify 在 dev 渠道被跳过（不是失败）：这里按 result 判定，成功或跳过都继续。
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      ZCODE_DESKTOP_DIST_DIR: dist-win-x64
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Prepare cache directories
        shell: bash
        run: mkdir -p .electron-cache .electron-builder-cache

      - name: Cache Electron and electron-builder artifacts
        uses: actions/cache@v6
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        run: node scripts/ci/release-version.mjs apply --version "${{ needs.resolve.outputs.version }}"

      - name: Bundle desktop app
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: Verify packaged version
        shell: bash
        env:
          BUNDLE_DIR: packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}
        run: |
          set -euo pipefail
          node scripts/ci/release-version.mjs verify \
            --expect "${{ needs.resolve.outputs.version }}" \
            --expect-commit "${{ needs.resolve.outputs.commit }}" \
            --asar "${BUNDLE_DIR}/win-unpacked/resources/app.asar"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-x64
          if-no-files-found: error
          retention-days: ${{ needs.resolve.outputs.prerelease == 'true' && 14 || 90 }}
          path: |
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/ZCode-${{ needs.resolve.outputs.version }}-win-x64.exe
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/ZCode-${{ needs.resolve.outputs.version }}-win-x64.exe.blockmap
            # FORK(github-update): 更新元数据随包发布（stable 与 dev 只会命中其中一个）。
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/latest.yml
            packages/desktop/${{ env.ZCODE_DESKTOP_DIST_DIR }}/dev.yml

  publish:
    name: Publish GitHub Release
    needs: [resolve, build-macos, build-windows]
    # 必须显式写条件：无 if 的作业隐式条件是 success()，而它要求依赖图上**所有祖先**作业成功，
    # 被跳过的 verify 是 publish 的传递祖先，会把 publish 一起判掉（dev 渠道实测踩到）。
    # 这里只要求三个直接依赖成功，因此 dev 渠道（verify skipped）能发布，
    # 而 tag 渠道 verify 失败时两个构建会被上面的条件挡掉、publish 随之不成立。
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          ls -lh
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 该 job 不 checkout，gh 需要显式仓库上下文才能操作 Release。
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt ${attempt} failed: $*" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          # 只有 stable 通道建 tag 发布。dev 通道不建 dev-<sha> 发布：客户端只认固定 tag 的
          # 指针发布（见下方 FORK-BEGIN(github-update) 段），一提交一个 Release 只会把 Releases
          # 页面堆成一串历史构建。
          if [[ "${PRERELEASE}" != "true" ]]; then
            title="ZCode ${VERSION}"
            summary="稳定发布。"
            notes=$(printf '%s\n' \
              "${summary}" \
              "" \
              "版本：${VERSION}" \
              "提交：${COMMIT}" \
              "构建流水线：${RUN_URL}" \
              "" \
              "macOS 安装包未签名、未公证，首次使用可能需要手动放行（按遇到的情况执行）：" \
              '- 打不开（提示“已损坏”或无法验证开发者）：执行 `xattr -cr /Applications/ZCode.app` 后重新启动。' \
              '- 能打开但连不上同一局域网内的主机（SSH 报 EHOSTUNREACH / No route to host）：执行 `codesign --force --deep --sign - /Applications/ZCode.app` 后重启应用。原因是 macOS 把“本地网络”权限记在应用的代码签名身份上，未签名的应用该授权不会生效。' \
              "产物校验见 SHA256SUMS.txt。")

            create_args=(--title "${title}" --notes "${notes}" --verify-tag)
            edit_args=(--title "${title}" --notes "${notes}")

            # 先 edit 再回退 create：避免一次存在性探测失败（503）把已有 Release 误路由成 create(422)。
            if ! retry gh release edit "${RELEASE_TAG}" "${edit_args[@]}"; then
              retry gh release create "${RELEASE_TAG}" "${create_args[@]}"
            fi
            retry gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            echo "dev 通道：跳过 dev-<sha> 发布，只更新指针发布"
          fi

          # FORK-BEGIN(github-update)
          # dev 通道还需要一份「固定地址」：客户端不知道下一次集成的提交号，无法按 tag 查询。
          # 这里把同一批资产镜像到固定 tag 的指针 Release，只覆盖资产、不移动 tag，
          # 因此不需要 force push。客户端读 .../releases/download/canary-build/dev.yml。
          if [[ "${PRERELEASE}" == "true" ]]; then
            pointer_tag="canary-build"
            pointer_title="Dev channel (latest canary)"
            pointer_notes=$(printf '%s\n' \
              "dev 通道指针发布：始终指向最新的 canary 集成构建。" \
              "" \
              "当前版本：${VERSION}" \
              "提交：${COMMIT}" \
              "构建流水线：${RUN_URL}" \
              "" \
              "macOS 安装包未签名、未公证，首次使用可能需要手动放行（按遇到的情况执行）：" \
              '- 打不开（提示“已损坏”或无法验证开发者）：执行 `xattr -cr /Applications/ZCode.app` 后重新启动。' \
              '- 能打开但连不上同一局域网内的主机（SSH 报 EHOSTUNREACH / No route to host）：执行 `codesign --force --deep --sign - /Applications/ZCode.app` 后重启应用。原因是 macOS 把“本地网络”权限记在应用的代码签名身份上，未签名的应用该授权不会生效。')
            pointer_args=(--title "${pointer_title}" --notes "${pointer_notes}" --prerelease --latest=false)

            if ! retry gh release edit "${pointer_tag}" "${pointer_args[@]}"; then
              # 指针 tag 通常已存在（只有资产在更新），用 --verify-tag 复用；不存在则按本次提交新建。
              if ! retry gh release create "${pointer_tag}" "${pointer_args[@]}" --verify-tag; then
                retry gh release create "${pointer_tag}" "${pointer_args[@]}" --target "${COMMIT}"
              fi
            fi
            retry gh release upload "${pointer_tag}" release-assets/* --clobber

            # 指针发布只保留本次集成的资产。资产名里带版本号（ZCode-<version>-<platform>-<arch>），
            # `--clobber` 只覆盖同名文件，因此不显式清理就会把每个历史版本的包一直堆在
            # 「Dev channel (latest canary)」上（实测堆到 18 个资产 / 3 个版本）。
            # 顺序是先传后清，避免出现指针没有任何资产的窗口。best-effort，失败不影响发布。
            keep_assets=$(cd release-assets && printf '%s\n' *)
            pointer_assets=$(gh release view "${pointer_tag}" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if [[ -n "${pointer_assets}" ]]; then
              while IFS= read -r pointer_asset; do
                if ! printf '%s\n' "${keep_assets}" | grep -qxF "${pointer_asset}"; then
                  gh release delete-asset "${pointer_tag}" "${pointer_asset}" --yes >/dev/null 2>&1 || true
                fi
              done <<< "${pointer_assets}"
            fi

            # 本流水线不再创建 dev-<sha> 发布；这里作为安全网清掉一切遗留或手工创建的 dev-*
            # 发布（含 tag）——dev 通道的包只应存在于指针发布上。best-effort，失败不影响发布。
            # 只匹配 ^dev-：canary-build 是 preview 更新通道的固定 tag 入口（客户端读它资产里的
            # dev.yml / dev-mac.yml），stable 是正式发布——两者都不在「旧 prerelease」范围内，
            # 把这里放宽成「所有 prerelease」会直接断掉预览通道的更新检查。
            old_dev_tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^dev-' || true)
            for old_dev_tag in ${old_dev_tags}; do
              gh release delete "${old_dev_tag}" --yes --cleanup-tag >/dev/null 2>&1 || true
            done
          fi
          # FORK-END(github-update)
