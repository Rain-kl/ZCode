name: Publish release artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      prerelease:
        required: true
        type: string
      commit:
        required: true
        type: string

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: "{mac-*,win-*,android-apk}"
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          ls -lh
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.apk' \) -print0 \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式固定发布仓库，避免 gh 的仓库推断改变发布目的地。
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          COMMIT: ${{ inputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt ${attempt} failed: $*" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          # 只有 stable 通道建 tag 发布。dev 通道不建 dev-<sha> 发布：客户端只认固定 tag 的
          # 指针发布（见下方 FORK-BEGIN(github-update) 段），一提交一个 Release 只会把 Releases
          # 页面堆成一串历史构建。
          if [[ "${PRERELEASE}" != "true" ]]; then
            title="ZCode ${VERSION}"
            summary="稳定发布。"
            notes=$(printf '%s\n' \
              "${summary}" \
              "" \
              "版本：${VERSION}" \
              "提交：${COMMIT}" \
              "构建流水线：${RUN_URL}" \
              "" \
              "macOS 安装包未签名、未公证，首次使用可能需要手动放行（按遇到的情况执行）：" \
              '- 打不开（提示“已损坏”或无法验证开发者）：执行 `xattr -cr /Applications/ZCode.app` 后重新启动。' \
              '- 能打开但连不上同一局域网内的主机（SSH 报 EHOSTUNREACH / No route to host）：执行 `codesign --force --deep --sign - /Applications/ZCode.app` 后重启应用。原因是 macOS 把“本地网络”权限记在应用的代码签名身份上，未签名的应用该授权不会生效。' \
              "产物校验见 SHA256SUMS.txt。")

            create_args=(--title "${title}" --notes "${notes}" --verify-tag)
            edit_args=(--title "${title}" --notes "${notes}")

            # 先 edit 再回退 create：避免一次存在性探测失败（503）把已有 Release 误路由成 create(422)。
            if ! retry gh release edit "${RELEASE_TAG}" "${edit_args[@]}"; then
              retry gh release create "${RELEASE_TAG}" "${create_args[@]}"
            fi
            retry gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            echo "dev 通道：跳过 dev-<sha> 发布，只更新指针发布"
          fi

          # FORK-BEGIN(github-update)
          # dev 通道使用固定地址，客户端读 .../releases/download/canary-build/dev.yml。
          # GitHub 不支持置顶 prerelease，且列表按 tag 的创建时间排序。删除旧 Release，
          # 把固定 tag 强制指向当前提交，再以 draft 重建并公开，才能让 canary 回到列表前部。
          if [[ "${PRERELEASE}" == "true" ]]; then
            pointer_tag="canary-build"
            pointer_title="Dev channel (latest canary)"
            pointer_notes=$(printf '%s\n' \
              "dev 通道指针发布：始终指向最新的 canary 集成构建。" \
              "" \
              "当前版本：${VERSION}" \
              "提交：${COMMIT}" \
              "构建流水线：${RUN_URL}" \
              "" \
              "macOS 安装包未签名、未公证，首次使用可能需要手动放行（按遇到的情况执行）：" \
              '- 打不开（提示“已损坏”或无法验证开发者）：执行 `xattr -cr /Applications/ZCode.app` 后重新启动。' \
              '- 能打开但连不上同一局域网内的主机（SSH 报 EHOSTUNREACH / No route to host）：执行 `codesign --force --deep --sign - /Applications/ZCode.app` 后重启应用。原因是 macOS 把“本地网络”权限记在应用的代码签名身份上，未签名的应用该授权不会生效。')
            pointer_args=(--title "${pointer_title}" --notes "${pointer_notes}" --prerelease --latest=false)

            if gh release view "${pointer_tag}" >/dev/null 2>&1; then
              retry gh release delete "${pointer_tag}" --yes
            fi
            retry gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${pointer_tag}" \
              -f "sha=${COMMIT}" -F force=true >/dev/null
            retry gh release create "${pointer_tag}" "${pointer_args[@]}" --verify-tag --draft
            retry gh release upload "${pointer_tag}" release-assets/* --clobber
            retry gh release edit "${pointer_tag}" "${pointer_args[@]}" --draft=false

            # 本流水线不再创建 dev-<sha> 发布；这里作为安全网清掉一切遗留或手工创建的 dev-*
            # 发布（含 tag）——dev 通道的包只应存在于指针发布上。
            # 只匹配 ^dev-：canary-build 是 preview 更新通道的固定 tag 入口（客户端读它资产里的
            # dev.yml / dev-mac.yml），stable 是正式发布——两者都不在「旧 prerelease」范围内，
            # 把这里放宽成「所有 prerelease」会直接断掉预览通道的更新检查。
            old_dev_tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^dev-' || true)
            for old_dev_tag in ${old_dev_tags}; do
              retry gh release delete "${old_dev_tag}" --yes --cleanup-tag
            done
          fi
          # FORK-END(github-update)
